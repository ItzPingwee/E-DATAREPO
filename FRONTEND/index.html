<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-DATA Visual Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; height: 100vh; display: flex; font-family: 'Segoe UI', sans-serif; background-color: #0a0a14; color: #ffffff; overflow: hidden; }
        
        #panel-vista { 
            width: 100%; height: 100%; background-color: #0a0a14; 
            position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        @keyframes cicloDiaNoche {
            0%   { background-color: #0a0a14; }
            40%  { background-color: #87CEEB; } 
            60%  { background-color: #87CEEB; } 
            100% { background-color: #0a0a14; } 
        }

        .titulo-vista { position: absolute; top: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.7); font-size: 40px; font-weight: 900; letter-spacing: 5px; margin: 0; pointer-events: none; z-index: 3; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .contenedor-botones-flotantes { position: absolute; top: 30px; left: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .btn-flotante { background: rgba(0,0,0,0.5); border: 1px solid #66fcf1; color: #66fcf1; padding: 12px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; backdrop-filter: blur(5px); transition: 0.3s; font-size: 14px; text-align: left; }
        .btn-flotante:hover { background: rgba(102,252,241,0.2); box-shadow: 0 0 15px rgba(102,252,241,0.4); }

        #reloj-simulacion { position: absolute; top: 30px; right: 40px; color: #ffffff; background: transparent; font-family: 'Share Tech Mono', monospace; font-size: 56px; padding: 10px; border: none; z-index: 10; display: none; text-shadow: 0 4px 15px rgba(0,0,0,0.8); letter-spacing: 4px; }
        
        #contadores-tiempo-real { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 10; display: none; }
        .caja-contador { background: rgba(11, 12, 16, 0.75); padding: 20px 35px; border-radius: 12px; border-bottom: 5px solid #4CAF50; backdrop-filter: blur(5px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); text-align: center; min-width: 220px; }
        .caja-contador .label { color: #c5c6c7; font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; font-weight: bold; }
        .caja-contador .valor { color: #4CAF50; font-size: 34px; font-weight: bold; text-shadow: 0 0 12px rgba(76, 175, 80, 0.5); }

        #imagen-casa-render { width: 100%; max-width: 1000px; max-height: 75vh; object-fit: contain; z-index: 1; }

        /* NUEVO: BOTÓN Y CHAT DE IA FLOTANTE */
        #btn-chat-ia {
            position: absolute; bottom: 40px; right: 40px;
            width: 70px; height: 70px; border-radius: 50%;
            background: linear-gradient(135deg, #9C27B0, #45a29e);
            border: 2px solid #66fcf1; color: white; font-size: 32px;
            box-shadow: 0 5px 20px rgba(156, 39, 176, 0.5);
            cursor: pointer; z-index: 50; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        #btn-chat-ia:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(102, 252, 241, 0.6); }
        
        #badge-ia {
            position: absolute; top: 0px; right: 2px;
            width: 18px; height: 18px; border-radius: 50%;
            background-color: #ff4d4d; border: 2px solid #0a0a14;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.8);
        }
        .oculto { opacity: 0; visibility: hidden; pointer-events: none; }

        #panel-chat-ia {
            position: absolute; bottom: 130px; right: 40px;
            width: 380px; max-height: 500px;
            background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(156, 39, 176, 0.5); border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 49; display: flex; flex-direction: column;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(0);
        }
        #panel-chat-ia.oculto { transform: translateY(20px); }
        
        .header-chat { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(156, 39, 176, 0.2); border-radius: 15px 15px 0 0; }
        .header-chat h3 { margin: 0; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .btn-cerrar-chat { background: none; border: none; color: #ff4d4d; font-size: 20px; cursor: pointer; }
        .cuerpo-chat { padding: 20px; overflow-y: auto; color: #E1BEE7; font-size: 14.5px; line-height: 1.6; }
        
        .vampiro-item { background: rgba(255, 77, 77, 0.15); padding: 10px; margin: 8px 0; border-left: 3px solid #ff4d4d; border-radius: 4px; font-size: 13px; color: #fff; }

        /* OVERLAYS GLOBALES (Catálogo y Casa) */
        .overlay-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(10px); z-index: 60; display: flex; flex-direction: column; padding: 40px; box-sizing: border-box; transition: opacity 0.3s ease, visibility 0.3s ease; overflow-y: auto; }
        .header-overlay { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
        .header-overlay h2 { margin: 0; color: #fff; font-weight: 300; letter-spacing: 2px; }
        .btn-cerrar-overlay { background: none; border: none; color: #ff4d4d; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .btn-cerrar-overlay:hover { transform: scale(1.2); }

        /* LAYOUT CATÁLOGO */
        .layout-catalogo { display: flex; gap: 40px; height: 100%; }
        .grid-catalogo-scroll { flex: 2; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); grid-auto-rows: max-content; gap: 20px; align-content: flex-start; align-items: start; padding-right: 15px; }
        
        .carta-dispositivo { background: rgba(31, 40, 51, 0.6); border: 2px solid rgba(102, 252, 241, 0.1); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; box-sizing: border-box; }
        .carta-dispositivo:hover { background: rgba(102, 252, 241, 0.1); transform: translateY(-5px); }
        .carta-seleccionada { border-color: #66fcf1; background: rgba(102, 252, 241, 0.15); box-shadow: 0 0 20px rgba(102,252,241,0.4); transform: translateY(-5px); }
        
        .checkmark-seleccion { opacity: 0; visibility: hidden; position: absolute; top: 10px; right: 10px; background-color: #0056b3; color: white; font-size: 12px; font-weight: bold; width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: all 0.2s ease; }
        .carta-seleccionada .checkmark-seleccion { opacity: 1; visibility: visible; }

        .img-placeholder { width: 70px; height: 70px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; color: #555; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .carta-dispositivo h4 { margin: 0; font-size: 15px; color: #fff; }
        .carta-dispositivo span { font-size: 12px; color: #45a29e; font-weight: bold; }

        .config-dispositivo { flex: 1; background: rgba(11, 12, 16, 0.6); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); padding: 30px; display: flex; flex-direction: column; gap: 20px; max-height: 100%; overflow-y: auto; }
        label { font-size: 14px; color: #c5c6c7; margin-bottom: -10px; display: block; }
        select, input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #45a29e; background-color: #1f2833; color: white; box-sizing: border-box; font-size: 15px; }
        .btn-accion { width: 100%; background-color: #45a29e; color: #0b0c10; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(69, 162, 158, 0.3); }
        .btn-accion:hover:not(:disabled) { background-color: #66fcf1; box-shadow: 0 0 15px rgba(102, 252, 241, 0.6); }
        
        #lista-dispositivos-agregados { flex-grow: 1; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-height: 200px; }
        .item-lista-agregado { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 6px; font-size: 13px; display: flex; justify-content: space-between; border-left: 3px solid #66fcf1; }

        .plano-casa { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }
        .habitacion-grid { background: rgba(31, 40, 51, 0.6); border: 1px solid rgba(102, 252, 241, 0.2); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .habitacion-grid h3 { margin: 0 0 15px 0; color: #c5c6c7; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        
        #grid-Cocina { border-top: 3px solid #66fcf1; }
        #grid-Sala { border-top: 3px solid #ba68c8; }
        #grid-Habitación\ Principal { border-top: 3px solid #66fcf1; }
        #grid-Exterior { border-top: 3px solid #ba68c8; }

        .grid-items { display: flex; flex-wrap: wrap; gap: 15px; align-content: flex-start; flex: 1; }
        .icono-aparato { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.1); border-left: 3px solid; border-radius: 8px; padding: 12px; width: 140px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .icono-aparato:hover { transform: translateY(-5px); }
        .icono-aparato strong { font-size: 14px; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icono-aparato span { font-size: 11px; color: #aaa; }
        .borde-desconectable { border-left-color: #ffb74d; }
        .borde-fijo { border-left-color: #90caf9; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .dot-on { background-color: #66fcf1; box-shadow: 0 0 5px #66fcf1; }
        .dot-off { background-color: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }
    </style>
</head>
<body>

    <div id="panel-vista">
        <h1 class="titulo-vista">SMART HOME</h1>
        
        <div class="contenedor-botones-flotantes">
            <button class="btn-flotante" onclick="toggleOverlay('overlay-catalogo')">➕ Agregar Dispositivo</button>
            <button class="btn-flotante" onclick="toggleOverlay('overlay-habitaciones')">🏠 Ver Mi Casa</button>
        </div>
        
        <div id="reloj-simulacion">00:00</div>
        <img id="imagen-casa-render" src="casa_edata-Photoroom.png" alt="Render Casa 3D">

        <div id="contadores-tiempo-real">
            <div class="caja-contador">
                <div class="label">Energía Acumulada</div>
                <div id="live-kwh" class="valor">0.00 kWh</div>
            </div>
            <div class="caja-contador">
                <div class="label">Costo Proyectado</div>
                <div id="live-cop" class="valor">$0</div>
            </div>
        </div>

        <!-- Chat Flotante IA -->
        <div id="panel-chat-ia" class="oculto">
            <div class="header-chat">
                <h3>🤖 Gemma 4 Analyst</h3>
                <button class="btn-cerrar-chat" onclick="cerrarChatIA()">✖</button>
            </div>
            <div class="cuerpo-chat">
                <p id="mensaje-ia-texto">Esperando ejecución de simulación...</p>
                <div id="resumen-fugas"></div>
            </div>
        </div>

        <!-- Botón de Simulación Global Flotante -->
        <button id="btn-chat-ia" onclick="manejarClickBotonFlotante()">
            <span id="icono-btn-ia">🤖</span>
            <div id="badge-ia" class="oculto"></div>
        </button>

        <!-- OVERLAY CATÁLOGO -->
        <div id="overlay-catalogo" class="overlay-panel oculto">
            <div class="header-overlay">
                <h2>Catálogo de Dispositivos</h2>
                <button class="btn-cerrar-overlay" onclick="toggleOverlay('overlay-catalogo')">✖</button>
            </div>
            <div class="layout-catalogo">
                <div class="grid-catalogo-scroll" id="grid-catalogo"></div>
                <div class="config-dispositivo">
                    <h3 id="txt-nombre-seleccion" style="color: #66fcf1; margin-top:0; border-bottom:1px solid #333; padding-bottom:15px;">Selecciona un dispositivo</h3>
                    
                    <label>Habitación de destino:</label>
                    <select id="select-habitacion">
                        <option value="Cocina">Cocina</option>
                        <option value="Sala">Sala</option>
                        <option value="Habitación Principal">Habitación Principal</option>
                        <option value="Exterior">Exterior</option>
                    </select>

                    <div id="opciones-variables">
                        <p id="txt-info-fija" style="display: none; color: #45a29e; font-size: 13px; margin: 0; background: rgba(69, 162, 158, 0.1); padding: 10px; border-radius: 8px;"></p>
                        
                        <div id="div-minutos" style="margin-top: 20px;">
                            <label>Minutos de uso al día:</label>
                            <input type="number" id="input-minutos" value="30" min="1" max="1440" style="margin-top: 15px;">
                        </div>
                        
                        <div id="div-conexion" style="display: flex; align-items: center; margin-top: 20px;">
                            <input type="checkbox" id="check-conectado" checked style="width: auto; margin-right: 15px; transform: scale(1.2);">
                            <label style="margin:0; cursor:pointer;" for="check-conectado">¿Dejar enchufado (Standby)?</label>
                        </div>

                        <div style="display: flex; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #333;">
                            <input type="checkbox" id="check-desconectable" checked style="width: auto; margin-right: 15px; transform: scale(1.2);">
                            <label style="margin:0; cursor:pointer; color:#ffb74d;" for="check-desconectable">¿Fácil de desconectar (Físicamente)?</label>
                        </div>
                    </div>
                    
                    <button class="btn-accion" style="margin-top: 20px;" onclick="agregarDispositivo()">➕ Instalar en la casa</button>

                    <div id="lista-dispositivos-agregados">
                        <span style="color:#aaa; font-size:12px; font-style:italic;">Aún no has agregado dispositivos.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- OVERLAY HABITACIONES -->
        <div id="overlay-habitaciones" class="overlay-panel oculto">
            <div class="header-overlay">
                <h2>Dispositivos por Habitación</h2>
                <button class="btn-cerrar-overlay" onclick="toggleOverlay('overlay-habitaciones')">✖</button>
            </div>
            <div class="plano-casa">
                <div class="habitacion-grid" id="grid-Cocina"><h3>Cocina</h3><div class="grid-items"></div></div>
                <div class="habitacion-grid" id="grid-Sala"><h3>Sala</h3><div class="grid-items"></div></div>
                <div class="habitacion-grid" id="grid-Habitación Principal"><h3>Habitación Principal</h3><div class="grid-items"></div></div>
                <div class="habitacion-grid" id="grid-Exterior"><h3>Exterior</h3><div class="grid-items"></div></div>
            </div>
        </div>
    </div>

    <script>
        function toggleOverlay(id) { document.getElementById(id).classList.toggle('oculto'); }

        const catalogoExcel = [
            { nombre: "Air-fryer", watts_activos: 1400, watts_standby: 2, tipo: "variable", desconectable: true, icono: "🍳" },
            { nombre: "Microondas", watts_activos: 1200, watts_standby: 4, tipo: "variable", desconectable: true, icono: "♨️" },
            { nombre: "Televisor OLED", watts_activos: 100, watts_standby: 5, tipo: "variable", desconectable: true, icono: "📺" },
            { nombre: "Sanduchera", watts_activos: 800, watts_standby: 0, tipo: "variable", desconectable: true, icono: "🥪" },
            { nombre: "Refrigerador", watts_activos: 300, watts_standby: 0, tipo: "ciclo", desconectable: false, icono: "❄️" },
            { nombre: "Router WiFi", watts_activos: 15, watts_standby: 0, tipo: "continuo", desconectable: false, icono: "🌐" }
        ];

        let casaUsuario = {};
        let indexSeleccionado = 0;
        let estadoBotonFlotante = 'IDLE'; // IDLE, CALCULANDO, LISTO

        window.onload = () => { renderizarCatalogoGrid(); };

        function renderizarCatalogoGrid() {
            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';
            catalogoExcel.forEach((item, index) => {
                const claseSeleccion = index === indexSeleccionado ? 'carta-seleccionada' : '';
                grid.innerHTML += `
                    <div class="carta-dispositivo ${claseSeleccion}" onclick="seleccionarDispositivo(${index})">
                        <div class="checkmark-seleccion">✔</div>
                        <div class="img-placeholder">${item.icono}</div>
                        <h4>${item.nombre}</h4>
                        <span>⚡ ~${item.watts_activos}W</span>
                    </div>
                `;
            });
            actualizarFormularioUI();
        }

        function seleccionarDispositivo(index) {
            indexSeleccionado = index;
            renderizarCatalogoGrid();
        }

        function actualizarFormularioUI() {
            const aparato = catalogoExcel[indexSeleccionado];
            document.getElementById('txt-nombre-seleccion').innerText = `Configurando: ${aparato.nombre}`;
            const divMin = document.getElementById('div-minutos');
            const divCon = document.getElementById('div-conexion');
            const txtInfo = document.getElementById('txt-info-fija');
            const chkDesc = document.getElementById('check-desconectable');

            if (aparato.tipo === "variable") {
                divMin.style.display = "block"; divCon.style.display = "flex"; txtInfo.style.display = "none";
                chkDesc.checked = true;
            } else if (aparato.tipo === "ciclo") {
                divMin.style.display = "none"; divCon.style.display = "none"; txtInfo.style.display = "block";
                txtInfo.innerHTML = "ℹ️ Motor cíclico: Funciona ~30% del día en modo automático.";
                chkDesc.checked = false;
            } else {
                divMin.style.display = "none"; divCon.style.display = "none"; txtInfo.style.display = "block";
                txtInfo.innerHTML = "ℹ️ Equipo Continuo: Requiere conexión 24h activa.";
                chkDesc.checked = false;
            }
        }

        function agregarDispositivo() {
            const hab = document.getElementById('select-habitacion').value;
            const aparato = catalogoExcel[indexSeleccionado];
            let hrs = 0, conectado = true;

            if (aparato.tipo === "variable") {
                hrs = document.getElementById('input-minutos').value / 60;
                conectado = document.getElementById('check-conectado').checked;
            } else if (aparato.tipo === "ciclo") {
                hrs = 24 * 0.30; conectado = true;
            } else { hrs = 24; conectado = true; }

            if (!casaUsuario[hab]) casaUsuario[hab] = [];
            casaUsuario[hab].push({
                nombre: aparato.nombre, watts_activos: aparato.watts_activos, watts_standby: aparato.watts_standby,
                horas_uso: hrs, dejado_conectado: conectado, desconectable: document.getElementById('check-desconectable').checked
            });

            renderizarCasa();
            renderizarListaAgregadosEnCatalogo();
            estadoBotonFlotante = 'IDLE'; // Si agrega nuevo aparato, obliga a simular de nuevo
            document.getElementById('icono-btn-ia').innerText = '🤖';
            document.getElementById('badge-ia').classList.add('oculto');
        }

        function renderizarListaAgregadosEnCatalogo() {
            const lista = document.getElementById('lista-dispositivos-agregados');
            lista.innerHTML = '';
            let contadorTotal = 0;
            for (const [hab, aparatos] of Object.entries(casaUsuario)) {
                aparatos.forEach(ap => {
                    contadorTotal++;
                    lista.innerHTML += `<div class="item-lista-agregado"><span><strong>${ap.nombre}</strong></span><span style="color:#aaa;">📍 ${hab}</span></div>`;
                });
            }
            if(contadorTotal === 0) lista.innerHTML = `<span style="color:#aaa; font-size:12px; font-style:italic;">Aún no has agregado dispositivos.</span>`;
        }

        function renderizarCasa() {
            document.querySelectorAll('.grid-items').forEach(el => el.innerHTML = '');
            for (const [hab, aparatos] of Object.entries(casaUsuario)) {
                const gridId = 'grid-' + hab.replace(/\s+/g, '\\ ');
                const areaPlano = document.querySelector(`#${gridId} .grid-items`);
                if(areaPlano) {
                    aparatos.forEach(ap => {
                        const claseBorde = ap.desconectable ? 'borde-desconectable' : 'borde-fijo';
                        const dotClass = ap.dejado_conectado ? 'dot-on' : 'dot-off';
                        const txtEstado = ap.dejado_conectado ? 'Standby ON' : 'Apagado';
                        areaPlano.innerHTML += `
                            <div class="icono-aparato ${claseBorde}">
                                <strong>${ap.nombre}</strong>
                                <span>⚡ Activo: ${ap.horas_uso.toFixed(1)}h</span>
                                <span><i class="status-dot ${dotClass}"></i>${txtEstado}</span>
                            </div>`;
                    });
                }
            }
        }

        /* LÓGICA DEL BOTÓN FLOTANTE UNIFICADO */
        async function manejarClickBotonFlotante() {
            if (Object.keys(casaUsuario).length === 0) {
                alert("Para simular, primero debes agregar al menos un dispositivo a la casa.");
                return;
            }

            if (estadoBotonFlotante === 'IDLE') {
                await ejecutarMotorTotal();
            } else if (estadoBotonFlotante === 'LISTO') {
                abrirChatIA();
            }
        }

        function abrirChatIA() {
            document.getElementById('panel-chat-ia').classList.remove('oculto');
            document.getElementById('badge-ia').classList.add('oculto'); // Se oculta notificación al leer
        }

        function cerrarChatIA() {
            document.getElementById('panel-chat-ia').classList.add('oculto');
        }

        async function ejecutarMotorTotal() {
            estadoBotonFlotante = 'CALCULANDO';
            document.getElementById('icono-btn-ia').innerText = '⏳';
            document.getElementById('badge-ia').classList.add('oculto');
            document.getElementById('panel-chat-ia').classList.add('oculto'); // Ocultar si estaba abierto

            const payload = { habitaciones: Object.entries(casaUsuario).map(([hab, disp]) => ({ nombre: hab, dispositivos: disp })) };

            try {
                // 1. Matemáticas
                const resMath = await fetch('http://127.0.0.1:8000/api/simular', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!resMath.ok) throw new Error("Error en servidor.");
                const datos = await resMath.json();
                
                // Preparar resumen de vampiros para el chat
                let htmlVampiros = "";
                if (datos.ranking_vampiros.length > 0) {
                    htmlVampiros = `<hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;"><h4 style="color:#ff4d4d; margin:0 0 10px 0;">Fugas en Reposo Detectadas:</h4>`;
                    datos.ranking_vampiros.forEach(v => {
                        htmlVampiros += `<div class="vampiro-item"><strong>${v.dispositivo}</strong> - ${v.watts_fantasma}W desperdiciados</div>`;
                    });
                }
                document.getElementById('resumen-fugas').innerHTML = htmlVampiros;

                // 2. Transición y Contadores
                document.getElementById('panel-vista').style.animation = "none";
                void document.getElementById('panel-vista').offsetWidth; 
                document.getElementById('panel-vista').style.animation = "cicloDiaNoche 60s ease-in-out forwards";
                animarContadoresTiempoReal(datos.consumo_total_kwh, datos.costo_simulado_cop);

                // 3. IA (Gemma 4)
                document.getElementById('mensaje-ia-texto').innerText = "Gemma 4 está analizando tus datos...";
                
                const resIA = await fetch('http://127.0.0.1:8000/api/ia', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt_texto: datos.prompt_generado }) });
                const datosIA = await resIA.json();
                
                document.getElementById('mensaje-ia-texto').innerText = datosIA.mensaje_ia;
                
                // Estado final
                estadoBotonFlotante = 'LISTO';
                document.getElementById('icono-btn-ia').innerText = '🤖';
                document.getElementById('badge-ia').classList.remove('oculto'); // Muestra punto rojo

            } catch (error) { 
                alert(error.message);
                estadoBotonFlotante = 'IDLE';
                document.getElementById('icono-btn-ia').innerText = '🤖';
            }
        }

        function animarContadoresTiempoReal(kwhFinal, copFinal) {
            const reloj = document.getElementById('reloj-simulacion');
            const contadores = document.getElementById('contadores-tiempo-real');
            reloj.style.display = 'block'; contadores.style.display = 'flex';
            
            const txtKwh = document.getElementById('live-kwh');
            const txtCop = document.getElementById('live-cop');
            
            const duracion = 60000; const inicio = performance.now();

            function actualizar(tiempo) {
                let progreso = (tiempo - inicio) / duracion;
                if (progreso > 1) progreso = 1;

                let minSim = Math.floor(progreso * 1440);
                reloj.innerText = `${Math.floor(minSim / 60).toString().padStart(2, '0')}:${(minSim % 60).toString().padStart(2, '0')}`;
                txtKwh.innerText = `${(progreso * kwhFinal).toFixed(2)} kWh`;
                txtCop.innerText = `$${Math.floor(progreso * copFinal).toLocaleString('es-CO')}`;

                if (progreso < 1) requestAnimationFrame(actualizar);
            }
            requestAnimationFrame(actualizar);
        }
    </script>
</body>
</html>
